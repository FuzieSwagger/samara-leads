<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRM — клиенты Самарской области</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--acc:#2f81f7;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--violet:#a371f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);margin-bottom:16px;font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 10px;font:inherit}
  input{flex:1;min-width:220px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
  .stat b{font-size:16px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:#1c2128;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;z-index:1}
  tr:last-child td{border-bottom:0}
  .p{display:inline-block;min-width:20px;text-align:center;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700}
  .pA{background:rgba(63,185,80,.16);color:var(--ok)}
  .pB{background:rgba(210,153,34,.16);color:var(--warn)}
  .pC{background:rgba(139,148,158,.16);color:var(--muted)}
  .name{font-weight:600}
  .muted{color:var(--muted);font-size:12px}
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin:2px 4px 2px 0;border:1px solid var(--line)}
  .tag.none{color:var(--ok);border-color:rgba(63,185,80,.4)}
  .tag.booking{color:var(--warn);border-color:rgba(210,153,34,.4)}
  .tag.tg{color:#4fc3f7;border-color:rgba(79,195,247,.4)}
  .tag.vk{color:#7aa7ff;border-color:rgba(122,167,255,.4)}
  .tag.wa{color:#66d98a;border-color:rgba(102,217,138,.4)}
  .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .links a,.links button{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:transparent;color:var(--text);cursor:pointer}
  .links button:hover,.links a:hover{border-color:var(--acc);text-decoration:none}
  .st{font:inherit;padding:4px 6px;border-radius:5px;border:1px solid var(--line);background:#0d1117;color:var(--text);font-size:12px}
  .st[data-s="написал"]{border-color:var(--acc)}
  .st[data-s="ответил"]{border-color:var(--warn)}
  .st[data-s="созвон"]{border-color:var(--violet)}
  .st[data-s="сделка"]{border-color:var(--ok)}
  .st[data-s="отказ"]{border-color:var(--bad)}
  .pain{max-width:360px;color:var(--muted);font-size:12px}
  .contacts{white-space:nowrap}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--ok);color:#04140a;padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transform:translateY(10px);transition:.2s}
  .toast.on{opacity:1;transform:none}
  @media(max-width:1000px){.pain{display:none}}
</style>
</head>

const KEY = 'samara-leads-status-v3';
const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
const STATUSES = ['не писал','написал','ответил','созвон','сделка','отказ'];
const state = { q:'', niche:'', city:'', prio:'', site:'', status:'' };

LEADS.forEach(l => { l.status = saved[l.id] || l.status; });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function fillSelect(el, values, label) {
  el.innerHTML = '<option value="">' + label + '</option>' + values.map(v => '<option>' + esc(v) + '</option>').join('');
}
fillSelect($('#fNiche'), [...new Set(LEADS.map(l => l.niche))], 'Все ниши');
fillSelect($('#fCity'), [...new Set(LEADS.map(l => l.city))], 'Все города');
fillSelect($('#fStatus'), STATUSES, 'Все статусы');

function render() {
  const rows = LEADS.filter(l => {
    const q = state.q.toLowerCase();
    const hit = !q || [l.name,l.address,l.phone,l.city].join(' ').toLowerCase().includes(q);
    return hit && (!state.niche || l.niche === state.niche) && (!state.city || l.city === state.city) && (!state.prio || l.priority === state.prio) && (!state.site || l.siteKind === state.site) && (!state.status || l.status === state.status);
  });
  $('#rows').innerHTML = rows.map(l => {
    const links = [];
    if (l.channelLink) links.push('<a href="' + esc(l.channelLink) + '" target="_blank" rel="noopener">Написать</a>');
    if (l.phone) links.push('<a href="tel:' + esc(l.phone.replace(/[^\d+]/g,'')) + '">' + esc(l.phone) + '</a>');
    if (l.source) links.push('<a href="' + esc(l.source) + '" target="_blank" rel="noopener">Карты</a>');
    links.push('<button data-copy="' + esc(l.id) + '">Текст</button>');
    const chClass = l.channel === 'Telegram' ? 'tg' : l.channel === 'ВКонтакте' ? 'vk' : 'wa';
    return '<tr>' +
      '<td><span class="p p' + l.priority + '">' + l.priority + '</span></td>' +
      '<td><div class="name">' + esc(l.name) + '</div><div class="muted">' + esc(l.city) + ' · ' + esc(l.niche) + ' · ' + esc(l.address) + '</div><div class="links">' + links.join('') + '</div></td>' +
      '<td><span class="tag ' + chClass + '">' + esc(l.channelLabel) + '</span><div class="muted">' + esc(l.channelLink) + '</div><div style="margin-top:4px"><span class="tag ' + l.siteKind + '">' + esc(l.siteLabel) + '</span></div></td>' +
      '<td>' + (l.reviews || 0) + (l.rating ? '<div class="muted">★ ' + l.rating + '</div>' : '') + '</td>' +
      '<td class="pain">' + esc(l.pain) + '</td>' +
      '<td><select class="st" data-id="' + esc(l.id) + '">' + STATUSES.map(s => '<option' + (s === l.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="6" class="muted" style="padding:20px">Ничего не найдено</td></tr>';

  const counts = STATUSES.map(s => s + ': ' + LEADS.filter(l => l.status === s).length).join(' · ');
  $('#stats').innerHTML =
    '<div class="stat">Всего <b>' + LEADS.length + '</b></div>' +
    '<div class="stat">A <b>' + LEADS.filter(l => l.priority === 'A').length + '</b></div>' +
    '<div class="stat">Telegram <b>' + LEADS.filter(l => l.channel === 'Telegram').length + '</b></div>' +
    '<div class="stat">ВК <b>' + LEADS.filter(l => l.channel === 'ВКонтакте').length + '</b></div>' +
    '<div class="stat">Написал <b>' + LEADS.filter(l => l.status === 'написал').length + '</b></div>' +
    '<div class="stat">Ответили <b>' + LEADS.filter(l => l.status === 'ответил').length + '</b></div>' +
    '<div class="stat">Сделки <b>' + LEADS.filter(l => l.status === 'сделка').length + '</b></div>' +
    '<div class="stat muted">' + counts + '</div>';
}

document.addEventListener('change', e => {
  const sel = e.target.closest('select.st');
  if (sel) {
    const id = sel.dataset.id;
    saved[id] = sel.value;
    localStorage.setItem(KEY, JSON.stringify(saved));
    const l = LEADS.find(x => x.id === id);
    if (l) l.status = sel.value;
    sel.dataset.s = sel.value;
    render();
  }
});

document.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-copy]');
  if (!btn) return;
  const l = LEADS.find(x => x.id === btn.dataset.copy);
  if (!l) return;
  try { await navigator.clipboard.writeText(l.msg); } catch {
    const ta = document.createElement('textarea'); ta.value = l.msg; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  const t = $('#toast'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1200);
});

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#fNiche').addEventListener('change', e => { state.niche = e.target.value; render(); });
$('#fCity').addEventListener('change', e => { state.city = e.target.value; render(); });
$('#fPrio').addEventListener('change', e => { state.prio = e.target.value; render(); });
$('#fSite').addEventListener('change', e => { state.site = e.target.value; render(); });
$('#fStatus').addEventListener('change', e => { state.status = e.target.value; render(); });

$('#export').addEventListener('click', () => {
  const data = { version: 1, exportedAt: new Date().toISOString(), statuses: saved };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'leads-status.json';
  a.click();
});

$('#exportCsv').addEventListener('click', () => {
  const out = ['Название;Город;Ниша;Приоритет;Статус;Канал;Ссылка;Телефон;Сайт']
    .concat(LEADS.map(l => [l.name,l.city,l.niche,l.priority,l.status,l.channelLabel,l.channelLink,l.phone,l.siteLabel].map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(';')))
    .join('\r\n');
  const blob = new Blob(['\uFEFF' + out], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'leads-status.csv';
  a.click();
});

$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const incoming = data.statuses || data;
    Object.assign(saved, incoming);
    localStorage.setItem(KEY, JSON.stringify(saved));
    location.reload();
  } catch {
    alert('Не получилось прочитать файл. Нужен JSON, который выгружает кнопка «Экспорт (JSON)».');
  }
});

render();
</script>
